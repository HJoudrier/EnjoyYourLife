<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Le reste de ta vie</title>
  <!-- Une page de cahier : la marge rouge, puis une grille de semaines,
       le vécu (plein), aujourd'hui (rouge) et le reste (vide). -->
  <clipPath id="tile"><rect width="64" height="64" rx="15"/></clipPath>
  <rect width="64" height="64" rx="15" fill="#1d2660"/>
  <!-- La marge rouge du cahier. -->
  <rect x="8" y="0" width="1.6" height="64" fill="#ff5f72" opacity="0.75" clip-path="url(#tile)"/>
  <g fill="#f5f6fb">
    <rect x="16" y="14" width="10" height="10" rx="2.2"/>
    <rect x="29" y="14" width="10" height="10" rx="2.2"/>
    <rect x="42" y="14" width="10" height="10" rx="2.2"/>
    <rect x="16" y="27" width="10" height="10" rx="2.2"/>
  </g>
  <rect x="29" y="27" width="10" height="10" rx="2.2" fill="#ff5f72"/>
  <g fill="none" stroke="#8fa1e8" stroke-width="1.8">
    <rect x="42.9" y="27.9" width="8.2" height="8.2" rx="1.6"/>
    <rect x="16.9" y="40.9" width="8.2" height="8.2" rx="1.6"/>
    <rect x="29.9" y="40.9" width="8.2" height="8.2" rx="1.6"/>
    <rect x="42.9" y="40.9" width="8.2" height="8.2" rx="1.6"/>
  </g>
</svg>
